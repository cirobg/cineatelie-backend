[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cineatelie"
version = "0.1.0"
description = "Cine Ateliê backend — API and worker"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0.35,<3.0",
    "asyncpg>=0.30,<1.0",
    "alembic>=1.13,<2.0",
    # Alembic runs synchronously and is a separate concern from the app's async runtime
    # (ADR-004 picks async SQLAlchemy over asyncpg for the *application*; the migration
    # tool is a CI/deploy-time step outside the request path, and psycopg is the driver
    # with the most predictable support for handing it a large, hand-written, multi
    # statement, dollar-quoted SQL script verbatim — see db/versions/20260926_0001_baseline.py).
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cineatelie"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
