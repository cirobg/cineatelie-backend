[alembic]
script_location = db
prepend_sys_path = .

# No URL here on purpose: a real connection string is a secret, and this file is
# committed to git. db/env.py reads MIGRATION_DATABASE_URL from the environment instead
# (database spec §8.1 — the migrator role, never the application role).
sqlalchemy.url =

file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
